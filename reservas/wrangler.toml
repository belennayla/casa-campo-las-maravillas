# Servidor de reservas · Casa Campo Las Maravillas
# Etapa 1: solo desarrollo local. Nada de esto está creado todavía en la nube.
name = "reservas-casacampo"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Vence los bloqueos temporales cada 5 minutos (en local se prueba con /__scheduled).
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "reservas"
# Se completa cuando se cree la base en Cloudflare (paso siguiente, con tu autorización).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
SITE_URL = "https://casacampolasmaravillas.github.io"
ORIGENES_PERMITIDOS = "https://casacampolasmaravillas.github.io,http://localhost:8080"
BLOQUEO_MINUTOS = "30"
# Interruptores de seguridad: los pagos online y la confirmación automática quedan APAGADOS.
PAGOS_HABILITADOS = "false"
MP_MODO = "prueba"
CONFIRMACION_AUTOMATICA = "false"
