# Publica la web en GitHub Pages y sincroniza los calendarios.
# Corre: cada vez que se suben cambios, de forma programada, y a mano desde la pestaña Actions.
# (GitHub no garantiza el horario de las ejecuciones programadas: pueden demorarse algunas horas.)
name: Sincronizar calendarios y publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - id: pages
        uses: actions/configure-pages@v5

      - name: Sincronizar calendarios (Airbnb, Booking, Vrbo…)
        env:
          ICAL_URLS: ${{ secrets.ICAL_URLS }}
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/sincronizar.js

      # Solo se publican los archivos de la web (lista blanca). La carpeta reservas/ y los archivos internos quedan afuera.
      - name: Armar la web pública
        run: node scripts/armar-sitio.js

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # A veces GitHub tarda en registrar el paquete: se espera y se reintenta.
      - if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
